<!doctype html>
<meta charset="utf-8">
<title>funground runner tests</title>
<body>
<canvas id="canvas" width="640" height="400"></canvas>
<pre id="output"></pre>
<script type="module">
// Driven by tools/test_runner.py, which serves this page, receives the results and the canvas snapshots, and
// stops Chrome. It uses the runner exactly as a site would (runner/runner.js) and nothing else.
import { createRunner } from "/runner/runner.js";

const canvas = document.getElementById("canvas");
const lines = [];
let frameCount = 0, finished = null;
const files = [];                                 // what the runner reported through onFile (S-212)
let snapshotAt = 0, snapshot = null;                  // the canvas as it is when frame `snapshotAt` is drawn
const report = { cases: [], scenarios: {} };
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const post = (path, body) => fetch(path, { method: "POST", body });
const log = (text) => { console.log(text); return post("/log", `${Math.round(performance.now() / 1000)} s  ${text}`); };
const until = async (condition, ms, what) => {
  const end = performance.now() + ms;
  while (!condition()) {
    if (performance.now() > end) throw new Error(`timed out waiting for ${what}`);
    await sleep(20);
  }
};

try {
const t0 = performance.now();
const runner = await createRunner({
  canvas,
  baseUrl: new URL("/runner/", location.href),
  prewarm: new URLSearchParams(location.search).get("prewarm") !== "0",
  output: (text, stream) => lines.push({ stream, text }),
  onFrame: (n) => {
    frameCount = n;
    if (n === 1) report.first_frame_ms ??= Math.round(performance.now());      // since the page began loading: the first frame of the first sketch
    if (n === snapshotAt) snapshot = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
  },
  onFinish: (reason) => { finished = reason; },
  onFile: (file) => files.push(file),
});
report.first_load_ms = Math.round(performance.now() - t0);
report.ready = runner.info;

async function start(source, options) {
  frameCount = 0; finished = null; lines.length = 0; files.length = 0;
  return runner.run(source, options);
}

// ---- the examples: the frame at `frames` is sent to the driver, which compares it with the golden.
// The goldens are made with the random generator seeded with 0 (tests/conftest.py), so each file starts with that
// one line, and the canvas is copied in the frame callback, at exactly frame `frames`, not some frames later.
const cases = await (await fetch("/cases.json")).json();
for (const c of cases) {
  const result = { id: c.id };
  log(`case ${c.id}`);
  try {
    const base = `/runner/runtime/examples/${c.source.slice(0, c.source.lastIndexOf("/") + 1)}`;
    const source = await (await fetch(`/runner/runtime/examples/${c.source}`)).text();
    const files = {};
    for (const name of c.files) files[name] = new Uint8Array(await (await fetch(base + name)).arrayBuffer());
    log('start ' + c.id);
    const t = performance.now();
    snapshotAt = c.frames; snapshot = null;
    const started = await start("import funground\nfunground.random_seed(0)\n" + source, { filename: c.source.split("/").pop(), files, width: 640, height: 400 });
    result.start_ms = Math.round(performance.now() - t);
    if (!started.ok) throw new Error(lines.map((l) => l.text).join("\n"));
    await until(() => snapshot !== null, 60000, `frame ${c.frames}`);
    const data = snapshot;
    await post(`/snap?id=${c.id}&w=${data.width}&h=${data.height}`, data.data);
    result.frame_ms = Math.round(performance.now() - t);
    result.output = lines.map((l) => l.text);
    runner.stop();
  } catch (error) {
    result.error = String(error.message ?? error);
    result.output = lines.map((l) => l.text);
    runner.stop();
  }
  report.cases.push(result);
}

log('Stop: a sketch');
const scenarios = new URLSearchParams(location.search).get("scenarios") === "1";
if (scenarios) {
// ---- Stop: a sketch that never returns from draw()
{
  const source = "import funground as f\ndef setup():\n    f.size(200, 200)\ndef draw():\n    f.background('white')\n    if f.frame_count > 5:\n        while True:\n            pass\nf.run()\n";
  await start(source, { filename: "hang.py" });
  await until(() => frameCount >= 3, 20000, "frames before the hang");
  await sleep(1500);                                              // it is spinning by now
  let beats = 0;
  const beat = setInterval(() => beats++, 50);                    // the page's own thread must stay alive
  const t = performance.now();
  runner.stop();
  const stopMs = performance.now() - t;
  const framesAtStop = frameCount;
  await sleep(1000);
  clearInterval(beat);
  const framesAfterStop = frameCount - framesAtStop;
  const next = await start("import funground as f\nf.size(100, 100)\nf.background('red')\nf.show()\n", { filename: "after.py" });
  report.scenarios.stop = { stop_call_ms: Math.round(stopMs * 10) / 10, finished_reason: finished, frames_after_stop: framesAfterStop,
    page_beats_in_1s: beats, next_run_ok: next.ok };
  runner.stop();
}

log('print and traceback');
// ---- print and traceback
{
  const source = "import funground as f\nprint('hello', 42)\ndef draw():\n    f.background('white')\n    print(1 / 0)\nf.run()\n";
  log("bad.py starting");
  const started = await start(source, { filename: "bad.py" });

  log(`bad.py started ${JSON.stringify(started)}`);
  await until(() => finished !== null, 20000, "the error");
  report.scenarios.errors = { started: started.ok, finished, output: lines.map((l) => ({ ...l })) };
}

log('syntax error');
// ---- syntax error and an error in setup, before the file starts
{
  const started = await start("def broken(:\n    pass\n", { filename: "syntax.py" });
  report.scenarios.syntax = { ok: started.ok, finished, output: lines.map((l) => ({ ...l })) };
}

log('input events');
// ---- input events reach the sketch (logical pixels)
{
  const source = [
    "import funground as f", "def setup():", "    f.size(300, 200)", "def draw():", "    pass",
    "def mouse_pressed():", "    print('pressed', f.mouse_x, f.mouse_y, f.mouse_button)",
    "def key_pressed():", "    print('key', repr(f.key))",
    "def mouse_wheel(delta):", "    print('wheel', delta)", "f.run()"].join("\n");
  await start(source, { filename: "events.py" });
  log("events started");
  await until(() => frameCount >= 2, 20000, "a frame");
  log("events frames");
  const box = canvas.getBoundingClientRect();
  const at = (x, y) => ({ clientX: box.left + x, clientY: box.top + y, pointerId: 1, bubbles: true, button: 0, buttons: 1 });
  canvas.dispatchEvent(new PointerEvent("pointermove", at(30, 40)));
  canvas.dispatchEvent(new PointerEvent("pointerdown", at(30, 40)));
  canvas.dispatchEvent(new KeyboardEvent("keydown", { key: "a", keyCode: 65, bubbles: true }));
  canvas.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowLeft", keyCode: 37, bubbles: true }));
  canvas.dispatchEvent(new WheelEvent("wheel", { clientX: box.left + 5, clientY: box.top + 6, deltaY: 100, bubbles: true, cancelable: true }));
  await sleep(1500);
  report.scenarios.events = { canvas_css: [canvas.style.width, canvas.style.height], output: lines.map((l) => l.text) };
  runner.stop();
  log('events done');
}


log('fonts on demand');
// ---- fonts on demand (S-211): a font is fetched only when funground opens it. The server notes every request; the page asks
// for the font requests since its last mark. Each run has a fresh worker, so nothing is carried over from the one before.
{
  const manifest = await (await fetch("/runner/runtime/manifest.json")).json();
  const fonts = manifest.files.filter((f) => f.role === "font");
  const fontRequests = async () => (await (await fetch("/requests.json")).json()).filter((r) => r.includes("/runtime/fonts/"));
  const drawn = async (source, filename) => {
    await post("/mark", "");
    const started = await start(source, { filename });
    if (started.ok) await until(() => frameCount >= 3, 30000, "three frames");
    runner.stop();
    await sleep(300);
    return { ok: started.ok, output: lines.map((l) => l.text), requests: await fontRequests() };
  };
  const shapes = String.raw`import funground as f
def setup():
    f.size(200, 200)
def draw():
    f.background('white')
    f.circle(100, 100, 50)
f.run()
`;
  const hello = String.raw`import funground as f
def setup():
    f.size(200, 100)
def draw():
    f.background('white')
    f.text('Hello', 10, 10)
f.run()
`;
  const rich = String.raw`import funground as f
def setup():
    f.size(200, 100)
def draw():
    f.background('white')
    f.text('Hi \U0001F600 \u0928\u092e\u0938\u094d\u0924\u0947', 10, 10)
f.run()
`;
  const everyFont = `import os, funground as f
import funground.typography as t
f.size(50, 50)
for n in ${JSON.stringify(fonts.map((f) => f.font))}:
    path = os.path.join(t.FONT_DIR, n)
    t.FontResource(path)                    # opening a bundled font fetches it
    print(n, os.path.getsize(path))
f.show()
`;
  const noText = await drawn(shapes, "shapes.py");
  const plainText = await drawn(hello, "hello.py");
  const richText = await drawn(rich, "rich.py");
  await post("/mark", "");
  await start(everyFont, { filename: "every_font.py" });
  await sleep(500);
  const sizes = Object.fromEntries(lines.map((l) => l.text.split(" ")).filter((p) => p.length === 2));
  runner.stop();
  // A host that changes what it sends. "compress": every font is gzip-encoded with Content-Encoding, as GitHub Pages does,
  // so the Content-Length is not the font's size. "corrupt": the bytes differ from the manifest's (same length, last byte changed).
  const hostile = async (mode) => {
    await post(`/fontmode?mode=${mode}`, "");
    await post("/mark", "");
    const result = {};
    try {
      let frames = 0;
      lines.length = 0;
      const second = await createRunner({ canvas, baseUrl: new URL("/runner/", location.href), prewarm: false,
        output: (text) => lines.push({ stream: "x", text }), onFrame: (n) => { frames = n; } });
      const inkText = hello.replace("f.text(", `f.fill('black')
    f.text(`);
      const started = await second.run(inkText, { filename: `hello_${mode}.py` });
      if (mode === "corrupt") {
        await until(() => lines.length > 0, 30000, "the error about the corrupt font");      // the first frame fails
      } else if (started.ok) {
        await until(() => frames >= 3, 30000, `three frames with ${mode} fonts`);
        const pixels = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
        let inked = 0;
        for (let i = 0; i < pixels.length; i += 4) if (pixels[i] < 128) inked++;      // dark pixels of the text on white
        result.inked = inked;
      }
      Object.assign(result, { ok: started.ok, output: lines.map((l) => l.text), requests: await fontRequests() });
      second.stop();
    } catch (error) {
      result.error = String(error.message ?? error);
    }
    await post("/fontmode?mode=off", "");
    return result;
  };
  const compressed = await hostile("compress");
  const corrupt = await hostile("corrupt");
  report.scenarios.fonts = {
    mode: runner.info.fonts, compressed, corrupt,
    manifest_fonts: fonts.map((f) => f.font), no_text: noText, hello: plainText, rich: richText,
    every_font: { sizes, expected: Object.fromEntries(fonts.map((f) => [f.font, String(f.size)])), requests: await fontRequests() },
  };
}

log('saved files');
// ---- files the sketch saved (S-212): onFile gets each once, with the right bytes
{
  const magic = (bytes, text) => text.split("").every((c, i) => bytes[i] === c.charCodeAt(0));
  const loop = String.raw`import funground as f
def setup():
    f.size(200, 150)
def draw():
    f.background('orange')
    f.circle(100, 75, 40)
    if f.frame_count == 3:
        f.save('out.png')
        f.save('out.pdf')
f.run()
`;
  const passed = { "data/note.txt": new TextEncoder().encode("passed in") };
  await start(loop, { filename: "saver.py", files: passed });
  await until(() => files.length >= 2, 30000, "two saved files");
  await sleep(700);                                              // the loop goes on: a file must not be sent again
  runner.stop();
  const byName = Object.fromEntries(files.map((f) => [f.name, f]));
  report.scenarios.saves = {
    names: files.map((f) => f.name),
    png: byName["out.png"] && { type: byName["out.png"].type, size: byName["out.png"].bytes.length, magic: magic(byName["out.png"].bytes, "\x89PNG\r\n\x1a\n") },
    pdf: byName["out.pdf"] && { type: byName["out.pdf"].type, size: byName["out.pdf"].bytes.length, magic: magic(byName["out.pdf"].bytes, "%PDF-") },
  };
  // a script: saves while it runs, ends by itself; an SVG and a GIF (GIF needs Pillow, loaded because the source says ".gif")
  const script = String.raw`import funground as f
f.size(120, 80)
f.background('teal')
f.circle(60, 40, 20)
f.save('pic.svg')
f.frame_duration(0.1)
f.save('pic.gif')
f.show()
`;
  const started = await start(script, { filename: "script_saver.py" });
  await until(() => finished !== null && files.length >= 2, 30000, "the script's files").catch(() => {});
  const byName2 = Object.fromEntries(files.map((f) => [f.name, f]));
  report.scenarios.script_saves = {
    ok: started.ok, output: lines.map((l) => l.text), names: files.map((f) => f.name),
    svg: byName2["pic.svg"] && { type: byName2["pic.svg"].type, has_svg: new TextDecoder().decode(byName2["pic.svg"].bytes).includes("<svg") },
    gif: byName2["pic.gif"] && { type: byName2["pic.gif"].type, magic: magic(byName2["pic.gif"].bytes, "GIF8") },
  };
  runner.stop();
}


log('web fonts');
// ---- fonts from the web (S-230, D-119): f.load_font(address) downloads through the worker's fetchUrl the first time; the copy
// (fonts/<name>) and fonts/sources.json reach onFile like any saved file; a second run given them back reads no network; an
// address that cannot be reached gives funground's plain sentence. The font is one the test server serves on this origin.
{
  const address = `${location.origin}/runner/runtime/fonts/DejaVuSans-Bold.ttf.bin`;
  const webFontRequests = async () => (await (await fetch("/requests.json")).json()).filter((r) => r.includes("DejaVuSans-Bold.ttf.bin"));
  const sketch = (where) => String.raw`import funground as f
f.size(200, 80)
f.background('white')
f.text_font(f.load_font('${where}'), 40)
f.fill('black')
f.text('Ag', 10, 10)
f.show()
`;
  const result = {};
  try {
    await post("/mark", "");
    const first = await start(sketch(address), { filename: "web_font.py" });
    await until(() => finished !== null && files.length >= 2, 30000, "the kept font and its sources.json").catch(() => {});
    const kept = Object.fromEntries(files.map((f) => [f.name, f.bytes]));
    const sources = kept["fonts/sources.json"] ? JSON.parse(new TextDecoder().decode(kept["fonts/sources.json"])) : {};
    result.first = { ok: first.ok, output: lines.map((l) => l.text), names: files.map((f) => f.name), sources, requests: await webFontRequests() };
    runner.stop();

    await post("/mark", "");
    const second = await start(sketch(address), { filename: "web_font.py", files: kept });
    await until(() => finished !== null, 30000, "the second run").catch(() => {});
    result.second = { ok: second.ok, output: lines.map((l) => l.text), requests: await webFontRequests() };
    runner.stop();

    const third = await start(sketch("http://127.0.0.1:9/nofont.ttf"), { filename: "web_font_bad.py" });
    await until(() => finished !== null || lines.length > 0, 30000, "the error").catch(() => {});
    result.unreachable = { ok: third.ok, output: lines.map((l) => l.text) };
    runner.stop();
  } catch (error) {
    result.error = String(error.message ?? error);
  }
  report.scenarios.web_fonts = result;
}

log('input lines');
// ---- Input lines (S-272): run(source, {stdin}) feeds input() and sys.stdin; the lines running out is one plain EOFError.
// Output without a newline is sent when input() reads and when the run ends. A reused runner (Play's preview) checks that
// nothing carries over from one run to the next: neither a last line nor the lines themselves.
{
  const out = [];
  let ended = null;
  const runner = await createRunner({
    canvas: document.createElement("canvas"), baseUrl: new URL("/runner/", location.href), reuse: true,
    output: (text, stream) => out.push({ stream, text }), onFinish: (reason) => { ended = reason; },
  });
  const runScript = async (source, options) => {
    out.length = 0; ended = null;
    const started = await runner.run(source, { filename: "main.py", ...options });
    await until(() => ended !== null, 30000, "the script to end").catch(() => {});
    await sleep(100);
    return { ok: started.ok, ended, output: out.map((l) => ({ ...l })) };
  };
  const reader = 'name = input("Your name? ")\nage = int(input("Age? "))\nprint(f"{name} is {age}")\ninput("third? ")\nprint("never")\n';
  report.scenarios.stdin = {
    two: await runScript(reader, { stdin: ["Ada", "12"] }),
    readline: await runScript("import sys\nprint(repr(sys.stdin.readline()), repr(input()))\n", { stdin: ["first", "second"] }),
    partial: await runScript('print("a")\nprint("no newline", end="")\n'),
    next: await runScript('print("next run")\n'),
    none: await runScript('print("before")\ninput("Your name? ")\n'),
    bad: await runScript('print(1)\n', { stdin: "Ada" }),
  };
  runner.stop();
}

log('checks');
// ---- Checks (S-273): runner.check(source, {tests}) runs the code as plain Python, then each test; the answer is {tests, output, error}.
// A reused runner, as above: the last case runs an ordinary script on the same worker, to see that a check leaves nothing behind.
{
  const out = [];
  let ended = null;
  const runner = await createRunner({
    canvas: document.createElement("canvas"), baseUrl: new URL("/runner/", location.href), reuse: true,
    output: (text, stream) => out.push({ stream, text }), onFinish: (reason) => { ended = reason; },
  });
  const test = (name, code) => ({ name, code });
  const learner = 'def double(n):\n    return n * 2\n\nname = input("Name? ")\ntotal = double(5)\nprint("Hello,", name)\n';
  const tests = [
    test("passes", "assert double(4) == 8"),
    test("message", 'assert total == 11, "total should be 11"'),
    test("bare", "x = 1\nassert total == 11"),
    test("other", "print(totl)"),
    test("sees", 'assert output == "Name? Hello, Ada\\n" and "def double" in source and name == "Ada"'),
    test("changes", 'total = 99\nprint("this goes nowhere")'),
    test("unchanged", 'assert total == 10, "total is " + str(total)'),
  ];
  const checks = {};
  checks.basic = await runner.check(learner, { stdin: ["Ada"], tests });
  checks.streamed = out.length;                                            // a check sends no output messages
  checks.raises = await runner.check("total = 1\nprint(total)\nprint(totl)\n", { tests: [test("never", "assert True")] });
  checks.syntax = await runner.check("print(1\n", { tests: [test("never", "assert True")] });
  checks.runsOut = await runner.check('a = input("A? ")\nb = input("B? ")\n', { stdin: ["1"], tests: [test("never", "assert True")] });
  checks.noInput = await runner.check('input("Name? ")\n', { tests: [test("never", "assert True")] });
  checks.badTests = await runner.check("print(1)\n", { tests: "assert True" });
  out.length = 0; ended = null;
  const started = await runner.run('print("after", input())\n', { filename: "main.py", stdin: ["a check"] });
  await until(() => ended !== null, 30000, "the script to end").catch(() => {});
  await sleep(100);
  checks.after = { ok: started.ok, ended, output: out.map((l) => l.text) };
  report.scenarios.checks = checks;
  runner.stop();
}

log('pyodide alone');
// ---- Pyodide alone (S-274): a runner made with packages: [] loads Python and nothing else, and runs a file as a plain script. Its
// own runner, as for the checks. The resources are the names the worker fetched (runner.info.resources); the default runner's, above,
// are recorded beside them to show that today's start is unchanged.
{
  const out = [];
  let ended = null;
  const alone = await createRunner({
    canvas: document.createElement("canvas"), baseUrl: new URL("/runner/", location.href), reuse: true, packages: [],
    output: (text, stream) => out.push({ stream, text }), onFinish: (reason) => { ended = reason; },
  });
  const runScript = async (source, options) => {
    out.length = 0; ended = null;
    const started = await alone.run(source, { filename: "main.py", ...options });
    await until(() => ended !== null, 30000, "the script to end").catch(() => {});
    await sleep(100);
    return { started, ended, output: out.map((l) => ({ ...l })) };
  };
  const files = { "data/words.txt": new TextEncoder().encode("from a file\n") };
  const results = {
    plain: await runScript('name = input("Name? ")\nprint("Hello,", name)\nprint(open("data/words.txt").read().strip())\nprint("no newline", end="")\n',
      { stdin: ["Ada"], files, width: 321, height: 123 }),
    raises: await runScript("print('start')\nx = 1\nprint(x / 0)\n"),
    imports: await runScript("print('before')\nimport funground\nprint('after')\n"),
    fromImport: await runScript("from funground import circle\n"),
    after: await runScript("print('still works')\n"),
  };
  const checked = await alone.check("print(2 * 3)\n", { tests: [{ name: "six", code: 'assert output == "6\\n"' }, { name: "wrong", code: "assert False, 'no'" }] });
  report.scenarios.pyodide_alone = {
    ...results, checked, info: { versions: alone.info.versions, capabilities: alone.info.capabilities },
    resources: alone.info.resources.map((r) => ({ name: r.name, bytes: r.bytes })),
    default_resources: runner.info.resources.map((r) => ({ name: r.name, bytes: r.bytes })),
  };
  alone.stop();
}

log('packages');
// ---- The host's packages (S-276): createRunner({packages, install}). Each runner is its own, with `reuse` so that one worker serves
// the runs of a scenario, and is ended at the end (`dispose`: a script that never returns is stopped, and the runner ends its worker).
// What the worker fetched is read from inside it (performance.getEntriesByType in the script), because a page cannot see a worker's requests.
{
  const base = new URL("/runner/", location.href);
  const wheels = await (await fetch("/tests/out/wheels/index.json")).json();
  const open = async (options) => {
    const out = [];
    let ended = null;
    const created = await createRunner({ canvas: document.createElement("canvas"), baseUrl: base, reuse: true, prewarm: false, ...options,
      output: (text, stream) => out.push({ stream, text }), onFinish: (reason) => { ended = reason; } });
    const run = async (source, runOptions) => {
      out.length = 0; ended = null;
      const started = await created.run(source, { filename: "main.py", ...runOptions });
      await until(() => ended !== null, 60000, "the script to end").catch(() => {});
      await sleep(100);
      return { started, ended, output: out.map((l) => l.text) };
    };
    const fetched = async () => {                                // the files this worker has fetched so far, from inside it
      const answer = await run("import js\nprint(' '.join(r.name for r in js.performance.getEntriesByType('resource')))\n");
      return (answer.output[0] ?? "").split(" ");
    };
    const dispose = async () => {
      created.run("while True:\n    pass\n", { filename: "spin.py" });
      await sleep(200);
      await created.stop();                                      // the worker does not answer: the runner ends it (STOP_WAIT_MS)
    };
    return { runner: created, run, fetched, dispose, info: created.info };
  };
  const names = (resources) => resources.map((r) => r.name);
  const result = {};
  const rejection = (options) => createRunner({ canvas: document.createElement("canvas"), baseUrl: base, prewarm: false, ...options }).then(() => "accepted", (e) => e.message);

  // numpy, on import
  {
    const r = await open({ packages: ["numpy"] });
    const atReady = names(r.info.resources);
    const script = "import numpy as np; print(int(np.arange(10).sum()), np.linalg.det(np.array([[2.0, 0.0], [0.0, 3.0]])).round(6))\n";
    const numpy = await r.run(script);
    const afterRun = await r.fetched();
    const folder = await r.run("import helper\nprint(helper.VALUE)\nimport json, os, math\nprint('library ok')\n",
      { files: { "helper.py": new TextEncoder().encode("VALUE = 3\n") } });
    const outside = await r.run("print('before')\nimport pandas\nprint('after')\n");
    const outsideDotted = await r.run("import sklearn.linear_model\n");
    const afterOutside = await r.fetched();
    const checked = await r.runner.check("import pandas\n", { tests: [{ name: "never", code: "assert True" }] });
    const again = await r.run(script);
    result.numpy = { info: { versions: r.info.versions }, atReady, numpy, afterRun, folder, outside, outsideDotted, afterOutside, checked, again };
    await r.dispose();
  }

  // scikit-learn, at start
  {
    const r = await open({ packages: ["scikit-learn"], install: "at start" });
    const atReady = names(r.info.resources);
    const sklearn = await r.run("import numpy as np\nfrom sklearn.linear_model import LinearRegression\n\nx = np.arange(10).reshape(-1, 1)\ny = 2 * np.arange(10) + 1\n" +
      "model = LinearRegression().fit(x, y)\nprint(round(float(model.coef_[0]), 6), round(float(model.intercept_), 6))\n");
    const outside = await r.run("import pandas\n");
    result.sklearn = { atReady, versions: r.info.versions, sklearn, outside, afterRun: await r.fetched() };
    await r.dispose();
  }

  // an empty list: Python's own library only
  {
    const r = await open({ packages: [] });
    result.empty = { outside: await r.run("import numpy\n"), library: await r.run("import json, math\nprint(math.floor(2.5))\n") };
    await r.dispose();
  }

  // funground with numpy (the Session path)
  {
    let frames = 0;
    const r = await open({ packages: ["funground", "numpy"], onFrame: (n) => { frames = n; } });
    const sketch = await r.run("import funground as f\nimport numpy as np\nf.size(60, 40)\nf.background('teal')\nprint(int(np.arange(4).sum()))\nf.show()\n");
    const drawn = frames;
    const outside = await r.run("import funground as f\nimport pandas\nf.show()\n");
    const loop = await r.run("import funground as f\nf.size(60, 40)\ndef draw():\n    import pandas\nf.run()\n");
    result.session = { versions: Object.keys(r.info.versions), sketch, drawn, outside, loop };      // the loop's first step raises
    await r.dispose();
  }

  // host wheels, on import
  {
    const listed = [
      { name: "fgtest-good", url: `/tests/out/wheels/${wheels.good.file}`, sha256: wheels.good.sha256 },
      { name: "fgtest-badsum", url: `/tests/out/wheels/${wheels.badsum.file}`, sha256: "0".repeat(64) },
      { name: "fgtest-pandas", url: `/tests/out/wheels/${wheels.pandas.file}`, sha256: wheels.pandas.sha256 },
      { name: "fgtest-numpy", url: `/tests/out/wheels/${wheels.numpy.file}`, sha256: wheels.numpy.sha256, imports: ["fgtest_numpy"] },
      { name: "fgtest-tag", url: `/tests/out/wheels/${wheels.tag.file}`, sha256: wheels.tag.sha256 },
      { name: "fgtest-two", url: `/tests/out/wheels/${wheels.two.file}`, sha256: wheels.two.sha256 },
    ];
    await post("/mark", "");
    const r = await open({ packages: ["numpy", ...listed] });
    const atReady = names(r.info.resources);
    const requestedAtReady = (await (await fetch("/requests.json")).json()).filter((q) => q.includes("/wheels/"));
    const good = await r.run("import fgtest_good\nprint(fgtest_good.hello('Ada'))\n");
    const requestedAfter = (await (await fetch("/requests.json")).json()).filter((q) => q.includes("/wheels/"));
    const badsum = await r.run("print('before')\nimport fgtest_badsum\nprint('after')\n");
    const pandas = await r.run("import fgtest_pandas\n");
    const withNumpy = await r.run("import fgtest_numpy\nprint(fgtest_numpy.total())\n");
    const tag = await r.run("import fgtest_tag\n");
    const two = await r.run("import fgtest_two\nprint(fgtest_two.both())\n");
    const unrelated = await r.run("print('no wheel needed')\n");
    const fetched = await r.fetched();
    result.wheels = { atReady, requestedAtReady, requestedAfter, good, badsum, pandas, withNumpy, tag, two, unrelated, fetched, sha: { badsum: wheels.badsum.sha256, tag: wheels.tag.sha256 } };
    await r.dispose();
    // at start: a good wheel is installed before ready and its version is reported; a refused one fails createRunner
    const start = await open({ packages: [listed[0]], install: "at start" });
    result.wheels.start = { versions: start.info.versions, run: await start.run("import fgtest_good\nprint(fgtest_good.VERSION)\n"), fetched: await start.fetched() };
    await start.dispose();
    result.wheels.startBad = await rejection({ packages: [listed[1]], install: "at start" });
    result.wheels.startTag = await rejection({ packages: [listed[4]], install: "at start" });
  }

  // options that cannot work
  result.rejected = {
    notList: await rejection({ packages: "funground" }),
    notEntry: await rejection({ packages: [3] }),
    noSha: await rejection({ packages: [{ name: "x", url: "x-1-py3-none-any.whl", sha256: "abc" }] }),
    noName: await rejection({ packages: [{ url: "x-1-py3-none-any.whl", sha256: "0".repeat(64) }] }),
    install: await rejection({ packages: [], install: "sometimes" }),
    unknown: await rejection({ packages: ["numpy", "pandsa"] }),
  };
  report.scenarios.packages = result;
}

log('keep');
// ---- Keep (S-226): runner.keep(note) runs f.keep(note); studio/001.png, .py and .json each reach onFile once
// Its own runner, made as Play's preview makes it (reuse: true): then a script that has ended keeps its Python and can still be kept.
{
  const runner = await createRunner({
    canvas: document.createElement("canvas"), baseUrl: new URL("/runner/", location.href), reuse: true,
    output: (text, stream) => lines.push({ stream, text }), onFrame: (n) => { frameCount = n; },
    onFinish: (reason) => { finished = reason; }, onFile: (file) => files.push(file),
  });
  const start = (source, options) => {
    frameCount = 0; finished = null; lines.length = 0; files.length = 0;
    return runner.run(source, options);
  };
  const magic = (bytes, text) => text.split("").every((c, i) => bytes[i] === c.charCodeAt(0));
  const animated = String.raw`import funground as f
def setup():
    f.size(120, 80)
def draw():
    f.background('gold')
    f.circle(60, 40, 20)
f.run()
`;
  await start(animated, { filename: "keeper.py" });
  await until(() => frameCount >= 3, 30000, "frames before the keep");
  const first = await runner.keep("I kept the gold one");
  await sleep(700);                                              // the loop goes on: a file must not be sent again
  const namesAfterFirst = files.map((f) => f.name);
  const byName = Object.fromEntries(files.map((f) => [f.name, f]));
  const record = byName["studio/001.json"] && JSON.parse(new TextDecoder().decode(byName["studio/001.json"].bytes));
  const second = await runner.keep("A second one");
  // a script that has finished drawing can still be kept
  const script = String.raw`import funground as f
f.size(60, 40)
f.background('teal')
f.show()
`;
  const started = await start(script, { filename: "done.py" });
  await until(() => finished !== null, 30000, "the script to end").catch(() => {});
  const ended = await runner.keep("after the end");
  const endedNames = files.map((f) => f.name);
  // stopped: nothing to keep, and nothing is written
  await start(animated, { filename: "keeper.py" });
  await until(() => frameCount >= 2, 30000, "frames before the stop");
  await runner.stop();
  files.length = 0;
  const stopped = await runner.keep("too late");
  await sleep(300);
  report.scenarios.keeps = {
    first, second, ended, stopped, endedNames, stoppedFiles: files.map((f) => f.name),
    names: namesAfterFirst,
    png: byName["studio/001.png"] && { type: byName["studio/001.png"].type, magic: magic(byName["studio/001.png"].bytes, "\x89PNG\r\n\x1a\n") },
    py: byName["studio/001.py"] && { type: byName["studio/001.py"].type, same: new TextDecoder().decode(byName["studio/001.py"].bytes) === animated },
    json: record && { type: byName["studio/001.json"].type, note: record.note, sketch: record.sketch, size: record.size },
    scriptOk: started.ok,
  };
  runner.stop();
}

}
// ---- a different backing scale is the page's business (devicePixelRatio); report what this run used
report.scenarios.dpr = window.devicePixelRatio;
report.page_resources = performance.getEntriesByType("resource").map((e) => ({ name: e.name, bytes: e.encodedBodySize }));
} catch (error) {
  report.fatal = String(error.stack ?? error);
}
log("posting result");
await post("/result", JSON.stringify(report));
</script>
