<!doctype html>
<meta charset="utf-8">
<title>funground runner models tests</title>
<body>
<canvas id="canvas" width="640" height="400"></canvas>
<script type="module">
// Driven by tools/test_models.py (story S-232). Runs each case with a runner of its own, exactly as a site would, and posts one
// report: the output of each case, the files it asked for from the model site and the CDN, and when it finished. The model
// site (huggingface.co) is answered by tools/chrome_page.mjs, which the case controls through setHuggingFace().
import { createRunner } from "/runner/runner.js";

const canvas = document.getElementById("canvas");
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const post = (path, body) => fetch(path, { method: "POST", body });
const log = (text) => { console.log(text); return post("/log", text); };
const bytesOf = (base64) => Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));

const report = { cases: [] };
try {
  for (const c of await (await fetch("/cases.json")).json()) {
    const result = { id: c.id };
    const lines = [];
    let finished = null;
    let frames = 0;
    log(`case ${c.id}`);
    try {
      await window.setHuggingFace(c.hf ?? "files");
      if (c.clear_cache) await caches.delete("funground-models-v1");
      const before = (await window.requestsSoFar()).length;
      const runner = await createRunner({
        canvas,
        baseUrl: new URL("/runner/", location.href),
        prewarm: false,
        output: (text, stream) => lines.push({ stream, text }),
        onFinish: (reason) => { finished = reason; },
        onFrame: (count) => { frames = count; },
        onnxruntimeUrl: c.onnxruntime_url,
      });
      const files = Object.fromEntries(Object.entries(c.files ?? {}).map(([name, data]) => [name, bytesOf(data)]));
      const started = await runner.run(c.source, { filename: "sketch.py", files, width: 640, height: 400 });
      if (!started.ok) throw new Error(lines.map((l) => l.text).join("\n"));
      const end = performance.now() + c.wait_s * 1000;
      const done = () => lines.some((l) => new RegExp(c.until_output).test(l.text));
      while (!done() && finished === null && performance.now() < end) await sleep(50);
      result.reached = done();
      result.finished = finished;
      result.frames = frames;
      result.camera = runner.cameraState();
      await runner.stop();
      await sleep(300);
      result.requests = (await window.requestsSoFar()).slice(before).map((r) => ({ url: r.url, status: r.status }))
        .filter((r) => r.url.startsWith("https://"));
      result.cache = (await caches.keys()).includes("funground-models-v1") ? (await (await caches.open("funground-models-v1")).keys()).length : 0;
    } catch (error) {
      result.error = String(error.message ?? error);
    }
    result.output = lines.map((l) => `${l.stream}: ${l.text}`);
    report.cases.push(result);
  }
} catch (error) {
  report.fatal = String(error.stack ?? error);
}
await post("/result", JSON.stringify(report));
</script>
