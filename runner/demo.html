<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>funground in the browser</title>
<style>
  :root {
    --bg: #f6f7f5; --panel: #ffffff; --ink: #1f2a2a; --muted: #5d6b6b; --line: #d9dedb;
    --accent: #0f8a83; --accent-ink: #ffffff; --code-bg: #fbfcfb; --error: #b3261e; --stage: #eceeeb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161a1a; --panel: #1e2424; --ink: #e4ebe9; --muted: #9aa9a6; --line: #344040;
      --accent: #3cbfb5; --accent-ink: #0d1414; --code-bg: #192020; --error: #ff8a80; --stage: #232a2a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 12px 0 0; font-weight: 600; letter-spacing: .2px; }
  header h1 span { color: var(--accent); }
  select, button { font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--panel);
                   color: var(--ink); padding: 6px 10px; }
  select { max-width: 340px; }
  button { cursor: pointer; min-width: 72px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, select:focus-visible, textarea:focus-visible, canvas:focus-visible, .splitter:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { color: var(--muted); font-size: 14px; margin-left: auto; }

  main { flex: 1; display: flex; min-height: 0; padding: 12px 16px 16px; gap: 0; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex;
          flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  .pane > .title { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
                   padding: 6px 10px; border-bottom: 1px solid var(--line); }
  #editor-pane { flex: 0 0 var(--editor-width, 46%); }
  #view-pane { flex: 1 1 0; }
  #code { flex: 1; border: 0; resize: none; padding: 10px 12px; background: var(--code-bg); color: var(--ink);
          font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; tab-size: 4; white-space: pre; }
  .stage { flex: 1; overflow: auto; background: var(--stage); display: flex; align-items: flex-start;
           justify-content: center; padding: 16px; min-height: 120px; }
  canvas { display: block; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18); max-width: none; }
  #output { border-top: 1px solid var(--line); height: 9em; overflow: auto; padding: 6px 10px; margin: 0;
            font: 12.5px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  #output .stderr { color: var(--error); }

  .splitter { flex: 0 0 12px; cursor: col-resize; display: flex; align-items: center; justify-content: center;
              touch-action: none; }
  .splitter::before { content: ""; width: 4px; height: 44px; border-radius: 2px; background: var(--line); }
  .splitter:hover::before, .splitter.dragging::before { background: var(--accent); }

  @media (max-width: 760px) {          /* narrow screens: code above, picture below, no splitter */
    main { flex-direction: column; gap: 12px; }
    #editor-pane { flex: 0 0 auto; height: 45vh; }
    .splitter { display: none; }
  }
</style>

<header>
  <h1><span>funground</span> in the browser</h1>
  <select id="example" disabled aria-label="Example"></select>
  <button id="run" class="primary" disabled>Run</button>
  <button id="stop" disabled title="Stops a sketch that animates">Stop</button>
  <span id="status">Loading Python. The first time takes several seconds...</span>
</header>

<main>
  <section class="pane" id="editor-pane">
    <div class="title">Code</div>
    <textarea id="code" spellcheck="false" aria-label="Sketch code"></textarea>
  </section>
  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize code and picture"
       tabindex="0"></div>
  <section class="pane" id="view-pane">
    <div class="title">Picture</div>
    <div class="stage"><canvas id="canvas" width="640" height="400" tabindex="0"></canvas></div>
    <div id="output" aria-live="polite"></div>
  </section>
</main>

<script type="module">
// Needs runner/runtime/ (tools/build_runtime.py) and a web server: python -m http.server from the repository
// root (use the venv's python), then open /runner/demo.html. The code box is a plain textarea: the real
// editor (syntax colours, sharing by link, the sandboxed preview origin) is S-151 part 2.
import { createRunner } from "./runner.js";

const FEATURED = ["session1-01_first_sketch", "session1-06_animation", "session1-08_mouse", "session1-09_keyboard",
  "text-01_text", "paths-05_booleans", "basics-03_a_script", "images-01_load_image", "studios-03_rhythm", "animation-01_bounce"];
const $ = (id) => document.getElementById(id);
const root = new URL("runtime/examples/", import.meta.url);
const index = (await (await fetch(new URL("index.json", root))).json()).filter((e) => FEATURED.includes(e.id));
for (const e of index) $("example").add(new Option(`${e.id}: ${e.title}`, e.id));

const setStatus = (text) => { $("status").textContent = text; };
const runner = await createRunner({
  canvas: $("canvas"),
  output: $("output"),
  onFinish: (reason) => {
    setStatus({ ended: "Finished.", stopped: "Stopped.", error: "Stopped by an error (see below)." }[reason] ?? reason);
    $("stop").disabled = true;
  },
});

// ---- examples: the code goes into the box, the data files it reads are kept for the run

let entry, files = {};
async function loadExample() {
  runner.stop();                       // a new example never leaves the previous one running
  entry = index.find((e) => e.id === $("example").value);
  const folder = new URL(entry.source.replace(/[^/]*$/, ""), root);
  $("code").value = await (await fetch(new URL(entry.source, root))).text();
  files = {};
  for (const name of entry.files) files[name] = new Uint8Array(await (await fetch(new URL(name, folder))).arrayBuffer());
  $("output").textContent = "";
  setStatus("Ready. Press Run.");
}

// ---- running: Stop is offered only while a sketch animates; a script draws once and is finished

async function run() {
  $("output").textContent = "";
  $("run").disabled = true;
  setStatus("Starting...");
  const started = await runner.run($("code").value, { filename: entry.source.split("/").pop(), files });
  $("run").disabled = false;
  if (started.ok && runner.running) {
    setStatus("Running.");
    $("stop").disabled = false;
  }
}

// ---- the code box: Tab indents, Ctrl+Enter runs

$("code").addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    e.target.setRangeText("    ", e.target.selectionStart, e.target.selectionEnd, "end");
  } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    if (!$("run").disabled) run();
  }
});

// ---- the splitter: drag (or arrow keys) to share the width between code and picture; remembered per browser

const MIN_PERCENT = 20, MAX_PERCENT = 80;
function setEditorWidth(percent) {
  percent = Math.min(MAX_PERCENT, Math.max(MIN_PERCENT, percent));
  document.documentElement.style.setProperty("--editor-width", `${percent}%`);
  $("splitter").setAttribute("aria-valuenow", Math.round(percent));
  try { localStorage.setItem("funground-demo-editor-width", String(percent)); } catch { /* storage unavailable */ }
}
try {
  const saved = Number(localStorage.getItem("funground-demo-editor-width"));
  if (saved) setEditorWidth(saved);
} catch { /* storage unavailable: the default width stays */ }

$("splitter").addEventListener("pointerdown", (e) => {
  const splitter = e.currentTarget, main = splitter.parentElement;
  splitter.setPointerCapture(e.pointerId);
  splitter.classList.add("dragging");
  const move = (m) => {
    const box = main.getBoundingClientRect();
    setEditorWidth(((m.clientX - box.left) / box.width) * 100);
  };
  const up = () => {
    splitter.classList.remove("dragging");
    splitter.removeEventListener("pointermove", move);
    splitter.removeEventListener("pointerup", up);
  };
  splitter.addEventListener("pointermove", move);
  splitter.addEventListener("pointerup", up);
});
$("splitter").addEventListener("keydown", (e) => {
  const step = { ArrowLeft: -2, ArrowRight: 2 }[e.key];
  if (!step) return;
  e.preventDefault();
  const current = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--editor-width")) || 46;
  setEditorWidth(current + step);
});

// ---- start

$("example").onchange = loadExample;
$("run").onclick = run;
$("stop").onclick = () => runner.stop();
await loadExample();
$("example").disabled = $("run").disabled = false;
</script>
